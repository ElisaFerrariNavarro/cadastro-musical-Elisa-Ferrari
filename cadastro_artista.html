<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu principal - sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,🎵">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">


    <div class="page-header-bar">
        <h2>🎤 Novo Artista</h2>
        <div class="header-actions">
            <a href="index.html" class="btn-back">- Voltar ao menu</a>
        </div>
    </div>


    <form method="post" action="#" enctype="multipart/form-data">

<!-- form-grid: o CSS transforma em 2 colunas (grid 1fr 1fr). Os campos se encaixam 2 por linha. -->
    <div class="form-grid">

        <label for="nome">Nome do Artista <span style="color: var(--red);">*</span></label>

        <input type="text" id="nome" name="nome"
                        required placeholder="Ex: Djavan, Marisa Monte...">
    </div>

    <div class="form-group">
        <!-- campo opcional -->
         <label for="genero">Gênero Musical</label>
         <input type="text" id="genero" name="genero"
                        placeholder="Ex: MPB, Rock, Samba">
    </div>


    <div class="form-group">
        <label for="imagem">Foto do Artista</label>
        <input type="file" id="imagem" name="imagem" accept="image/*">
        <small>JPG ou PNG .  Máximo 5 MB</small>
    </div>
</div> <!-- Fim do form-grid-->

    <div class="form-action">
        <button type="submit" class="btn-primary">➕ Cadastrar</button>
    </div>
</form>

<!-- ===========TABELA DOS ARTISTAS ==========-->
 <h3>📋 Artistas Cadastrados</h3> <!-- h3: subtítulo da tabela -->

 <div class="table-cointainer">
    <table>
        <thead>
            <tr>
                <th class="col-foto">Foto</th>
                <th>Nome</th>
                <th>Gênero</th>
                <th>País</th>
                <th class="col-acoes">Ações</th>
            </tr>
        </thead>
        <tbody>
                <tr>
                    <td><div class="no-image">Sem<br>Foto</div></td>
                    <td>Djavan</td>
                    <td>MPB</td>
                    <td>Brasil</td>
                        <td>
                            <div class="action-buttons">
                                <a href=""class="btn-edit">✏️ Editar</a>
                                <a href=""class="btn-delete">️🗑️</a>
                                <!-- btn-music(verde) -->
                                 <a href="cadastro_musica.html" class="btn-music">🎵 Músicas</a>
                            </div>
                        </td>
                      </tr>
                      <tr>
                            <td><div class="no-image">Sem<br>Foto</div></td>
                            <td>Marisa Monte</td>
                            <td>MPB</td>
                            <td>Brasil</td>
                            <td>
                                <div class="action-buttons">
                                    <a href=""class="btn-edit">✏️ Editar</a>
                                    <a href=""class="btn-delete">️🗑️</a>
                                    <a href="cadastro_musica.html" class="btn-music">🎵 Músicas</a>
                                </div>
                            </td>
                      </tr>
                 </tbody>
          </table>
     </div>

</div>
</body>
</html>
